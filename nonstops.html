<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Nonstops home · Nov 1–3</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0d12; --card:#131820; --card2:#1a2029; --line:#242c38;
  --tx:#e8edf4; --dim:#8b98aa; --dim2:#5f6b7c;
  --gold:#f0b429; --grn:#34d399; --amb:#fbbf24; --red:#f87171; --blu:#60a5fa; --vio:#a78bfa;
}
html,body{max-width:100%;overflow-x:hidden}
body{background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;
  padding:0 0 96px;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:0 14px}

header{padding:24px 0 14px;border-bottom:1px solid var(--line);margin-bottom:14px}
h1{font-size:24px;line-height:1.15;letter-spacing:-.5px;font-weight:700}
.sub{color:var(--dim);font-size:13px;margin-top:6px;line-height:1.5}
.nav{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.nav a{font-size:11.5px;padding:5px 10px;border:1px solid var(--line);border-radius:20px;
  color:var(--dim);text-decoration:none;background:var(--card)}
.nav a.on{background:var(--gold);color:#000;border-color:var(--gold);font-weight:700}

/* sort bar */
.sort{display:flex;gap:6px;margin:4px 0 14px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.sort button{flex:0 0 auto;font-size:11.5px;padding:7px 12px;border:1px solid var(--line);border-radius:8px;
  color:var(--dim);background:var(--card);font-family:inherit;cursor:pointer;font-weight:600}
.sort button.on{background:#1c2836;border-color:var(--blu);color:var(--blu)}

/* city card */
.city{background:var(--card);border:1px solid var(--line);border-radius:13px;margin-bottom:14px;overflow:hidden}
.city.top{border-color:#3d5a3d;box-shadow:0 0 0 1px rgba(52,211,153,.13)}
.chead{padding:13px 15px 11px}
.crow1{display:flex;align-items:baseline;gap:9px}
.cname{font-size:18px;font-weight:700;letter-spacing:-.4px;flex:1}
.rank{font-size:11px;color:var(--dim2);font-weight:700}
.awe{flex:0 0 auto;display:flex;align-items:center;gap:5px}
.awe .n{font-size:15px;font-weight:700;color:var(--gold)}
.awe .l{font-size:9px;color:var(--dim2);text-transform:uppercase;letter-spacing:.6px}
.exp{font-size:12.5px;color:var(--dim);margin-top:5px;line-height:1.5}
.exp b{color:var(--tx)}

/* flight strip */
.fs{margin:10px 15px 0;background:#0e1218;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.fs .top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11px;color:var(--dim2);
  text-transform:uppercase;letter-spacing:.6px;margin-bottom:7px}
.fs .fno{color:var(--blu);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.3px;text-transform:none}
.strip{display:flex;align-items:center;gap:8px}
.pt{flex:0 0 auto;text-align:center;min-width:50px}
.pt .t{font-size:17px;font-weight:700;letter-spacing:-.4px;font-variant-numeric:tabular-nums;line-height:1.1}
.pt .c{font-size:10.5px;color:var(--dim);margin-top:2px;letter-spacing:.5px;font-weight:600}
.bar{flex:1;min-width:0}
.bar .d{font-size:10px;color:var(--dim);text-align:center;margin-bottom:4px;white-space:nowrap}
.bar .ln{height:2px;background:linear-gradient(90deg,var(--line),#3a4552,var(--line));border-radius:2px;position:relative}
.bar .ln::before,.bar .ln::after{content:'';position:absolute;top:-2.5px;width:7px;height:7px;border-radius:50%;background:var(--dim)}
.bar .ln::before{left:0}.bar .ln::after{right:0}
.bar .ln .pl{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#0e1218;padding:0 5px;font-size:10px;color:var(--dim2);line-height:1}
.fs .meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px;align-items:center}
.fs .meta span{font-size:10px;background:#131820;border:1px solid var(--line);border-radius:4px;padding:2px 6px;color:var(--dim2)}
.bed{font-size:9.5px;font-weight:700;padding:2.5px 7px;border-radius:4px;letter-spacing:.3px}
.bed.y{background:#123326;color:var(--grn)}
.bed.n{background:#2a1414;color:var(--red)}
.bed.m{background:#33270f;color:var(--amb)}

/* price grid — the ask */
.pg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin:10px 15px 0}
@media(max-width:360px){.pg{grid-template-columns:1fr}}
.pc{background:#0e1218;border:1px solid var(--line);border-radius:9px;padding:9px 10px;min-width:0}
.pc.hl{border-color:#2e4a3a}
.pc .k{font-size:9.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--dim2);white-space:nowrap}
.pc .v{font-size:17px;font-weight:700;margin-top:4px;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.pc .v.na{color:var(--dim2);font-size:13px;font-weight:600}
.pc .x{font-size:9.5px;color:var(--dim2);margin-top:2px;line-height:1.4;overflow-wrap:anywhere}

/* ── the matrix ── */
.mx{background:var(--card);border:1px solid var(--line);border-radius:13px;margin-bottom:18px;overflow:hidden}
.mxh{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.mxh .t{font-size:14px;font-weight:700;letter-spacing:-.2px}
.mxh .t small{display:block;font-size:10.5px;color:var(--dim2);font-weight:500;margin-top:2px}
.mxtog{display:flex;background:#0e1218;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:0 0 auto}
.mxtog button{font-size:11px;font-weight:700;padding:6px 12px;border:0;background:none;color:var(--dim2);font-family:inherit;cursor:pointer}
.mxtog button.on{background:var(--gold);color:#000}
.mxg{display:grid;grid-template-columns:minmax(76px,1.2fr) 1fr 1fr 1fr}
.mxg>div{padding:8px 6px;border-bottom:1px solid #171d26;min-width:0}
.mxg .hd{font-size:9px;text-transform:uppercase;letter-spacing:.5px;color:var(--dim2);font-weight:700;
  background:var(--card2);padding:7px 6px;text-align:center}
.mxg .hd:first-child{text-align:left;padding-left:12px}
.mxg .cc{font-size:12px;font-weight:700;padding-left:12px;line-height:1.25}
.mxg .cc small{display:block;font-size:8.5px;color:var(--dim2);font-weight:500;margin-top:1px}
.mxg .v{text-align:center;font-variant-numeric:tabular-nums;font-size:12.5px;font-weight:700;letter-spacing:-.3px;
  border-radius:6px;line-height:1.2;align-self:center}
.mxg .v small{display:block;font-size:8.5px;font-weight:500;opacity:.75;letter-spacing:0}
.mxg .v.g1{color:#4ade80}.mxg .v.g2{color:#a3e635}
.mxg .v.mid{color:var(--tx)}
.mxg .v.r2{color:#fb923c}.mxg .v.r1{color:#f87171}
.mxg .v.na{color:#3d4654;font-weight:500;font-size:11px}
.mxg .vf{background:rgba(52,211,153,.10);border-radius:6px}
.mxfoot{padding:9px 12px;font-size:10px;color:var(--dim2);line-height:1.5}

/* daily fares row */
.dly{display:flex;gap:6px;margin:8px 15px 0}
.dly .d{flex:1;background:#0e1218;border:1px solid var(--line);border-radius:8px;padding:7px 8px;text-align:center;min-width:0}
.dly .d.ch{border-color:#2e4a3a;background:#0d1a14}
.dly .d.off{opacity:.4}
.dly .d .k{font-size:9px;text-transform:uppercase;letter-spacing:.6px;color:var(--dim2)}
.dly .d .v{font-size:14.5px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums;letter-spacing:-.4px}
.dly .d.ch .v{color:var(--grn)}
.dly .d .v small{font-size:9px;color:var(--dim2);font-weight:500}
.dlyx{margin:5px 15px 0;font-size:10px;color:var(--dim2);line-height:1.45}

/* positioning row */
.pos{margin:8px 15px 0;background:#101720;border:1px solid var(--line);border-radius:9px;padding:9px 12px}
.pos .h{font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--dim2);font-weight:700;
  display:flex;justify-content:space-between;gap:8px;align-items:center}
.pos .h .pfno{color:var(--blu);font-weight:700;text-transform:none;font-size:11px;font-variant-numeric:tabular-nums}
.pos .b{font-size:11.5px;color:var(--dim);margin-top:5px;line-height:1.5}
.pos .b b{color:var(--tx)}
.pos .px{font-size:14px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.pos.none{border-left:3px solid var(--amb)}

/* award row */
.aw{margin:8px 15px 0;background:linear-gradient(180deg,#161226,#120f1d);border:1px solid #2c2445;border-radius:9px;padding:9px 12px}
.aw .h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.aw .p{font-size:11px;color:var(--vio);font-weight:700;text-transform:uppercase;letter-spacing:.6px}
.aw .cpp{font-size:11px;color:var(--vio);font-variant-numeric:tabular-nums}
.aw .rows{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:7px}
@media(max-width:360px){.aw .rows{grid-template-columns:1fr}}
.aw .r{min-width:0}
.aw .r .k{font-size:9px;text-transform:uppercase;letter-spacing:.5px;color:#6b628a}
.aw .r .v{font-size:13.5px;font-weight:700;color:#cabfff;font-variant-numeric:tabular-nums;margin-top:2px;letter-spacing:-.3px}
.aw .r .f{font-size:9.5px;color:#6b628a;margin-top:1px}
.aw .sp{font-size:10px;color:#8a7fb0;margin-top:7px;line-height:1.45}

/* footer of card */
.cfoot{padding:10px 15px 13px;font-size:11.5px;color:var(--dim2);line-height:1.5;margin-top:4px}
.cfoot b{color:var(--dim)}

.note{font-size:11.5px;color:var(--dim2);line-height:1.55;margin:16px 0}
.dead{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:12px 15px;margin-top:18px}
.dead h3{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--dim2);margin-bottom:8px}
.dead .d{font-size:12px;color:var(--dim2);padding:5px 0;border-bottom:1px solid #171d26;line-height:1.5}
.dead .d:last-child{border-bottom:0}
.dead .d b{color:var(--dim)}
footer{margin:30px 0 20px;padding-top:14px;border-top:1px solid var(--line);font-size:11px;color:var(--dim2);line-height:1.6}
.load{padding:50px 0;text-align:center;color:var(--dim2);font-size:13px}
h2.sec{font-size:12px;text-transform:uppercase;letter-spacing:1.3px;color:var(--dim2);margin:22px 0 10px;font-weight:700}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Nonstops home</h1>
  <div class="sub">Every European city with a nonstop to SFO on Nov 1–3, priced three ways for five,
  with the points play and how fun the week there is. Tap a sort.</div>
  <div class="nav">
    <a href="index.html">Builder</a>
    <a href="scenarios.html">Scenarios</a>
    <a href="whats-on.html">What's on</a>
    <a href="costed.html">Costed</a>
    <a href="flights.html">Flights</a>
    <a href="nonstops.html" class="on">Nonstops</a>
  </div>
</header>

<div class="sort" id="sort">
  <button data-k="best" class="on">Best overall</button>
  <button data-k="econ">Cheapest · 5 econ</button>
  <button data-k="mix">Cheapest · 2 biz + 3 econ</button>
  <button data-k="biz">Cheapest · 5 biz</button>
  <button data-k="pts">Best points value</button>
  <button data-k="fun">Most fun</button>
</div>

<div id="app"><div class="load">Loading…</div></div>

<footer id="foot"></footer>
</div>

<script src="nonstops-data.js"></script>
<script>
const D = window.__NS__ || {cities:[],dead:[],note:''};
let sortK='best';

function money(n){return n==null?null:'$'+Math.round(n).toLocaleString()}
function kpts(n){return n==null?null:(n/1000).toLocaleString(undefined,{maximumFractionDigits:0})+'k'}

function score(c){
  // best overall: experience per dollar with points value folded in
  const e=c.econ5?.usd||9999;
  return (c.experience?.score||0)*1400 - Math.min(e,6000)*0.6 + (c.award?.cppNum||0)*400;
}
const SORTS={
  best:(a,b)=>score(b)-score(a),
  econ:(a,b)=>(a.econ5?.usd||1e9)-(b.econ5?.usd||1e9),
  mix:(a,b)=>(a.mix?.usd||1e9)-(b.mix?.usd||1e9),
  biz:(a,b)=>(a.biz5?.usd||1e9)-(b.biz5?.usd||1e9),
  pts:(a,b)=>(b.award?.cppNum||0)-(a.award?.cppNum||0),
  fun:(a,b)=>(b.experience?.score||0)-(a.experience?.score||0),
};

function cardHTML(c,i){
  const f=c.flight||{};
  const bed=f.lie_flat==='yes'?['REAL BED','y']:f.lie_flat==='mixed-fleet'?['FLEET COIN-FLIP','m']
    :f.lie_flat==='recliner'?['RECLINER','m']:f.lie_flat==='no'?['NOT A BED','n']:null;
  let h='<div class="city'+(i===0&&sortK==='best'?' top':'')+'">';
  h+='<div class="chead"><div class="crow1"><span class="rank">'+(i+1)+'</span>'
    +'<div class="cname">'+c.city+'</div>'
    +'<div class="awe"><span class="n">'+(c.experience?.score??'—')+'</span><span class="l">fun<br>/10</span></div></div>';
  h+='<div class="exp"><b>'+(c.experience?.headline||'')+'</b>'
    +(c.experience?.detail?' — '+c.experience.detail:'')+'</div></div>';

  h+='<div class="fs"><div class="top"><span>'+(c.best_day||'Nov 1–3')+'</span>'
    +'<span class="fno">'+(f.no||'')+'</span></div>';
  h+='<div class="strip"><div class="pt"><div class="t">'+(f.dep||'—')+'</div><div class="c">'+(c.airport||'')+'</div></div>'
    +'<div class="bar"><div class="d">'+(f.duration||'')+' · nonstop</div><div class="ln"><span class="pl">✈</span></div></div>'
    +'<div class="pt"><div class="t">'+(f.arr||'—')+'</div><div class="c">SFO</div></div></div>';
  h+='<div class="meta"><span>'+(f.carrier||'')+'</span><span>'+(f.aircraft||'')+'</span>'
    +(bed?'<span class="bed '+bed[1]+'">'+bed[0]+'</span>':'')+'</div>';
  if(f.biz_seat)h+='<div class="meta"><span style="border:0;background:none;padding:2px 0">'+f.biz_seat+'</span></div>';
  h+='</div>';

  const dl=c.daily;
  if(dl){
    const days=[['Sun Nov 1',dl.nov1],['Mon Nov 2',dl.nov2],['Tue Nov 3',dl.nov3]];
    const live=days.filter(d=>d[1]>0);
    const min=live.length?Math.min(...live.map(d=>d[1])):0;
    h+='<div class="dly">';
    days.forEach(d=>{
      const off=!(d[1]>0);
      h+='<div class="d'+(off?' off':(d[1]===min?' ch':''))+'"><div class="k">'+d[0]+'</div>'
        +'<div class="v">'+(off?'<small>no flight</small>':money(d[1]))+'</div></div>';
    });
    h+='</div>';
    let xn=[];
    if(dl.operates)xn.push(dl.operates);
    if(dl.mix_note)xn.push(dl.mix_note);
    if(dl.confidence)xn.push(dl.confidence);
    if(xn.length)h+='<div class="dlyx">'+xn.join(' · ')+'</div>';
  }

  const po=c.positioning;
  if(po){
    h+='<div class="pos'+(po.exists==='yes'?'':' none')+'"><div class="h"><span>Getting there from Dubrovnik</span>'
      +(po.flight_no?'<span class="pfno">'+po.flight_no+'</span>':'')+'</div>';
    h+='<div class="b">'+(po.summary||'')+'</div>';
    if(po.price5_usd)h+='<div class="px">'+money(po.price5_usd)+' <small style="font-size:10px;color:var(--dim2);font-weight:500">for 5'+(po.price_confidence?' · '+po.price_confidence:'')+'</small></div>';
    h+='</div>';
  }

  h+='<div class="pg">';
  h+='<div class="pc"><div class="k">5 economy</div><div class="v">'+(money(c.econ5?.usd)||'<span class="na">n/a</span>')+'</div><div class="x">'+(c.econ5?.detail||'')+'</div></div>';
  h+='<div class="pc hl"><div class="k">2 biz + 3 econ</div><div class="v">'+(money(c.mix?.usd)||'<span class="na">n/a</span>')+'</div><div class="x">'+(c.mix?.detail||'')+'</div></div>';
  h+='<div class="pc"><div class="k">5 business</div><div class="v">'+(money(c.biz5?.usd)||'<span class="na">n/a</span>')+'</div><div class="x">'+(c.biz5?.detail||'')+'</div></div>';
  h+='</div>';

  const a=c.award;
  if(a){
    h+='<div class="aw"><div class="h"><span class="p">'+(a.program||'points')+'</span>'
      +(a.cpp?'<span class="cpp">'+a.cpp+'</span>':'')+'</div><div class="rows">';
    h+='<div class="r"><div class="k">5 econ</div><div class="v">'+(kpts(a.econ5_pts)||'—')+'</div><div class="f">'+(a.econ5_fees!=null?'+ '+money(a.econ5_fees):'')+'</div></div>';
    h+='<div class="r"><div class="k">2 biz + 3 econ</div><div class="v">'+(kpts(a.mix_pts)||'—')+'</div><div class="f">'+(a.mix_fees!=null?'+ '+money(a.mix_fees):'')+'</div></div>';
    h+='<div class="r"><div class="k">5 biz</div><div class="v">'+(kpts(a.biz5_pts)||'—')+'</div><div class="f">'+(a.biz5_fees!=null?'+ '+money(a.biz5_fees):'')+'</div></div>';
    h+='</div>'+(a.space?'<div class="sp">'+a.space+'</div>':'')+'</div>';
  }

  if(!c.positioning) h+='<div class="cfoot"><b>Getting there:</b> '+(c.getting_there||'—')+'</div>';
  else h+='<div style="height:13px"></div>';
  h+='</div>';
  return h;
}

let mxMode='cash';
function kfmt(n){return n>=1000?'$'+(n/1000).toFixed(1).replace(/\.0$/,'')+'k':'$'+n}
function matrixHTML(){
  const M=D.matrix||[];
  if(!M.length)return'';
  const cols=['e','m','b'];
  // rank cells per column for colour
  const rank={};
  cols.forEach(k=>{
    const vals=M.map(r=>mxMode==='cash'?r.cash[k]:(r.pts[k]?r.pts[k].k:null)).filter(v=>v!=null).sort((a,b)=>a-b);
    rank[k]=v=>{
      if(v==null)return'na';
      const i=vals.indexOf(v), n=vals.length;
      return i<2?'g'+(i+1):(i>=n-2?'r'+(n-i):'mid');
    };
  });
  let h='<div class="mx"><div class="mxh"><div class="t">The whole picture — all-in from Dubrovnik'
    +'<small>positioning flight + the nonstop home · whole family of 5 · sorted by economy</small></div>'
    +'<div class="mxtog"><button class="'+(mxMode==='cash'?'on':'')+'" onclick="mxSet(\'cash\')">Cash</button>'
    +'<button class="'+(mxMode==='pts'?'on':'')+'" onclick="mxSet(\'pts\')">Points</button></div></div>';
  h+='<div class="mxg"><div class="hd">City</div><div class="hd">5 econ</div><div class="hd">2 biz<br>+3 econ</div><div class="hd">5 biz</div>';
  M.forEach(r=>{
    h+='<div class="cc">'+r.city+'<small>'+kfmt(r.pos)+' · '+r.posN+'</small></div>';
    cols.forEach(k=>{
      if(mxMode==='cash'){
        const v=r.cash[k];
        h+='<div class="v '+rank[k](v)+(r.ptsNote&&k==='e'&&mxMode!=='cash'?' vf':'')+'">'+(v==null?'—':kfmt(v))+'</div>';
      }else{
        const p=r.pts[k];
        if(!p){h+='<div class="v na">no path</div>';}
        else h+='<div class="v '+rank[k](p.k)+(r.ptsNote==='verified'&&k==='e'?' vf':'')+'">'+(p.k/1000).toFixed(0)+'k<small>+ '+kfmt(p.c)+'</small></div>';
      }
    });
  });
  h+='</div><div class="mxfoot">'+(mxMode==='cash'
    ?'Every cell = positioning + exit for all five, one number. Green = cheapest two per column, red = priciest two.'
    :'Points cells = total points for the exit + (award fees + cash positioning). Programs differ per city — Avios for Dublin, Flying Blue for AMS/CDG/CPH, KrisFlyer for Zurich, Aeroplan for MUC/FRA. Highlighted = the only VERIFIED award space (Dublin economy). Istanbul and Orly have no points path from your Amex pool.')
    +'</div></div>';
  return h;
}
function mxSet(m){mxMode=m;render()}

function render(){
  const a=document.getElementById('app');
  const cs=[...(D.cities||[])].sort(SORTS[sortK]);
  if(!cs.length){a.innerHTML='<div class="load">Pricing swarm still running — this page fills itself when it lands.</div>';return}
  let h='';
  h+=matrixHTML();
  h+='<h2 class="sec">City detail</h2>';
  cs.forEach((c,i)=>h+=cardHTML(c,i));
  if(D.dead&&D.dead.length){
    h+='<div class="dead"><h3>Nonstops that are DEAD by November — do not plan around these</h3>';
    D.dead.forEach(d=>h+='<div class="d"><b>'+d.city+'</b> — '+d.why+'</div>');
    h+='</div>';
  }
  if(D.note)h+='<div class="note">'+D.note+'</div>';
  a.innerHTML=h;
  document.getElementById('foot').innerHTML=D.foot||'';
}
document.getElementById('sort').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  sortK=b.dataset.k;
  document.querySelectorAll('.sort button').forEach(x=>x.classList.toggle('on',x===b));
  render();window.scrollTo({top:0});
});
render();
</script>
</body>
</html>
